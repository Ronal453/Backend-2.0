spring:
  application:
    name: plantopolis-backend

  # ── Base de datos ────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:plantopolis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:Plantopolis123}
    driver-class-name: oracle.jdbc.OracleDriver

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

# ── Servidor ─────────────────────────────────────────────
server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:plantopolisJwtSecretKey2024MuyLargaMinimo256BitsParaHMACSHA}
  expiration: 86400000

# ── Resend (email transaccional vía HTTP) ─────────────────
# CAMBIO: reemplaza la antigua sección spring.mail (SMTP), porque la
# red bloquea los puertos 25/465/587. Resend usa HTTPS (puerto 443).
resend:
  api-key: ${RESEND_API_KEY:}
  mail-from: ${MAIL_FROM:onboarding@resend.dev}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operationsSorter: method
    disable-swagger-default-url: true

# ── Logs ─────────────────────────────────────────────────
logging:
  level:
    com.plantopolis: DEBUG