spring:
  application:
    name: plantopolis-backend

  # ── Base de datos PostgreSQL ─────────────────────────────
  # OBLIGATORIO: definir en variables de entorno o .env (evita exponer credenciales en repositorios públicos)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/plantopolis}
    username: ${SPRING_DATASOURCE_USERNAME:plantopolis_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

# ── Servidor ─────────────────────────────────────────────
server:
  port: 8080

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ── JWT ──────────────────────────────────────────────────
# OBLIGATORIO: JWT_SECRET debe tener mínimo 256 bits (32+ caracteres)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# ── Google OAuth2 ─────────────────────────────────────
google:
  client-id: ${GOOGLE_CLIENT_ID}

# ── Cookie de sesión ──────────────────────────────────
cookie:
  secure: ${COOKIE_SECURE:false}

# ── Resend (email transaccional vía HTTP) ─────────────────
# CAMBIO: reemplaza la antigua sección spring.mail (SMTP), porque la
# red bloquea los puertos 25/465/587. Resend usa HTTPS (puerto 443).
resend:
  api-key: ${RESEND_API_KEY:}
  mail-from: ${MAIL_FROM:onboarding@resend.dev}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operationsSorter: method
    disable-swagger-default-url: true

# ── Logs ─────────────────────────────────────────────────
logging:
  level:
    com.plantopolis: ${LOG_LEVEL:INFO}

# ── Tareas y Procesos Programados (HU23, HU28) ────────────
tareas:
  cron:
    # Generación diaria de instancias recurrentes (00:05 Bogotá)
    recurrentes: ${CRON_TAREAS_RECURRENTES:0 5 0 * * *}
    # Alerta diaria por email de tareas vencidas (07:00 Bogotá)
    alertas-vencidas: ${CRON_ALERTAS_VENCIDAS:0 0 7 * * *}
