spring:
  application:
    name: plantopolis-backend

  # ── Base de datos ────────────────────────────────────────
  # OBLIGATORIO: definir en variables de entorno o .env
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false

# ── Servidor ─────────────────────────────────────────────
server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────
# OBLIGATORIO: JWT_SECRET debe tener mínimo 256 bits (32+ caracteres)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# ── Google OAuth2 ─────────────────────────────────────
google:
  client-id: ${GOOGLE_CLIENT_ID}

# ── Cookie de sesión ──────────────────────────────────
cookie:
  secure: ${COOKIE_SECURE:false}

# ── Resend (email transaccional vía HTTP) ─────────────────
# CAMBIO: reemplaza la antigua sección spring.mail (SMTP), porque la
# red bloquea los puertos 25/465/587. Resend usa HTTPS (puerto 443).
resend:
  api-key: ${RESEND_API_KEY:}
  mail-from: ${MAIL_FROM:onboarding@resend.dev}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operationsSorter: method
    disable-swagger-default-url: true

# ── Logs ─────────────────────────────────────────────────
logging:
  level:
    com.plantopolis: ${LOG_LEVEL:INFO}