name: plantopolis
services:

  # ── BASE DE DATOS PostgreSQL ──────────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: plantopolis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plantopolis
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      # Volumen persistente de PostgreSQL
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización automática (esquema + semillas demo)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plantopolis-net
    restart: unless-stopped

  # ── BACKEND Spring Boot ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantopolis-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/plantopolis
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - plantopolis-net
    restart: unless-stopped

  # ── FRONTEND React + Nginx ────────────────────────────────
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: plantopolis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - plantopolis-net
    restart: unless-stopped

# ── VOLÚMENES ─────────────────────────────────────────────
volumes:
  postgres_data:

# ── RED ───────────────────────────────────────────────────
networks:
  plantopolis-net:
    driver: bridge
