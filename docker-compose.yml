services:

  # ── BACKEND Spring Boot ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantopolis-backend
    ports:
      - "8080:8080"
    environment:
      # oracle-xe es el nombre del contenedor en la misma red
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - plantopolis-net
    restart: unless-stopped

  # ── FRONTEND React + Nginx ───────────────────────────────
  frontend:
    build:
      context: ../From
      dockerfile: Dockerfile
    container_name: plantopolis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - plantopolis-net
    restart: unless-stopped

# ── Red personalizada (ya la creaste con docker network create) ──
networks:
  plantopolis-net:
    external: true    # ya existe, Docker no la crea nueva